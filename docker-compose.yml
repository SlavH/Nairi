services:
  nairi:
    build: .
    image: nairi:latest
    container_name: nairi
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENCODE_API_URL=http://opencode:4096
      - NAIRI_AI_BASE_URL=${NAIRI_AI_BASE_URL}
      - NAIRI_AI_API_KEY=${NAIRI_AI_API_KEY}
      - NAIRI_AI_MODEL=${NAIRI_AI_MODEL}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - WORKSPACE_BASE_PATH=/workspaces
    volumes:
      - /workspaces:/workspaces:rw
    depends_on:
      opencode:
        condition: service_started

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    restart: unless-stopped
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      - OPENCODE_CONFIG=/workspaces/opencode.json
      - OPENCODE_EXPERIMENTAL_WORKSPACES=true
    volumes:
      - /workspaces:/workspaces:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./opencode.json:/workspaces/opencode.json:ro
    working_dir: /workspaces
    entrypoint: ["opencode", "serve", "--port", "4096", "--hostname", "0.0.0.0", "--cors", "http://localhost:3000"]

networks:
  default:
    name: nairi-network
